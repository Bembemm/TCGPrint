name: Resume web validation

on:
  push:
    branches:
      - chatgpt/resume-web-pre-native
  workflow_dispatch:

concurrency:
  group: resume-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Build
        if: always()
        run: npm run build
      - name: Production smoke
        if: success()
        run: |
          npm run start -- -p 3101 > /tmp/tcgprint-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --head http://127.0.0.1:3101/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tcgprint-next.log
          exit 1
